# Seller sells items from the linked container, or from its own storage, using prices.yml.
# range is in blocks. Hard cap is 32. The seller does not use range to find items.

enabled: true
name: Seller
item-name: "<gold>Seller Minion"
material: EMERALD
helmet: EMERALD
chestplate: LEATHER_CHESTPLATE
leggings: ""
boots: ""
lore:
  - "<gray>Level {level}"
  - "<gray>Sells every {speed} ticks"
  - "<gray>Uses prices.yml."
levels:
  1:
    speed-ticks: 100
    range: 2
  2:
    speed-ticks: 70
    range: 2
  3:
    speed-ticks: 40
    range: 2
