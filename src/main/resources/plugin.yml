name: RexMinions
version: '${project.version}'
main: me.rexsystems.rexMinions.RexMinions
api-version: '1.21'
folia-supported: true
authors: [RexSystems]
description: Placeable minions that work in loaded chunks
website: https://rexsystems.me
softdepend: [PlaceholderAPI, WorldGuard]

commands:
  rexminions:
    description: RexMinions command
    aliases: [rminion, minions]
    usage: /rexminions <give|list|reload|help>

permissions:
  rexminions.use:
    description: Place and open minions
    default: true
  rexminions.give:
    description: Give minion items
    default: op
  rexminions.reload:
    description: Reload RexMinions
    default: op
  rexminions.admin:
    description: Manage any minion
    default: op
